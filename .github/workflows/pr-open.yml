name: PR

on:
  pull_request:
    branches: [main]

concurrency:
  # PR open and close use the same group, allowing only one at a time
  group: pr-${{ github.workflow }}-${{ github.event.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  # Images whose build context changed: pr-<number> and commit SHA tags only.
  # Release tags are written by merge.yml on push to main.
  builds:
    name: Builds
    uses: ./.github/workflows/.builds.yml
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    with:
      base: origin/${{ github.event.repository.default_branch }}
      release: false

  # Fixture tests for the scripts .builds.yml and merge.yml depend on
  build-scripts:
    name: Build Scripts
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Release tags
        run: |
          set -euo pipefail
          tag=${GITHUB_WORKSPACE}/.github/scripts/image-tag.sh
          # Every image in the repo must resolve a release tag
          find . -name Dockerfile -not -path './.git/*' | sort | while read -r f; do
            d=${f#./}; d=${d%/Dockerfile}
            echo "${d} -> $("${tag}" "${d}")"
          done
          # Multi-stage: the final FROM wins, lowercase builder stage ignored
          [ "$("${tag}" oracle-free/23)" = "23.26.3-faststart" ]
          fx="${RUNNER_TEMP}/tag"
          mkdir -p "${fx}"
          printf 'FROM --platform=linux/amd64 a/b:1 AS x\nFROM ghcr.io/c/d:2.0@sha256:abc AS final\n' > "${fx}/Dockerfile"
          [ "$("${tag}" "${fx}")" = "2.0" ]
          printf 'FROM localhost:5000/e\n' > "${fx}/Dockerfile"
          if out=$("${tag}" "${fx}" 2>&1); then
            echo "::error::Untagged FROM resolved to '${out}'"
            exit 1
          fi
          grep -q "has no tag" <<< "${out}"
          echo "Release tag fixtures passed"

      - name: Changed images
        run: |
          set -euo pipefail
          check="${GITHUB_WORKSPACE}/.github/scripts/changed-images.sh"
          fx="${RUNNER_TEMP}/images"
          git init -q "${fx}"
          cd "${fx}"
          git config user.email ci@example.invalid
          git config user.name ci
          mkdir -p pkg/1 pkg/2 nested/pkg/3/sub top
          for d in pkg/1 pkg/2 nested/pkg/3; do echo 'FROM x:1' > "${d}/Dockerfile"; done
          echo 'FROM x:1' > top/Dockerfile
          touch pkg/1/shim.c pkg/2/README.md nested/pkg/3/sub/conf top/run.sh
          git add -A && git commit -qm base
          expect() {
            got=$("${check}" HEAD~1)
            [ "${got}" = "$1" ] || { echo "::error::$2: got ${got}, expected $1"; exit 1; }
            echo "ok: $2 -> ${got}"
          }
          echo x >> pkg/1/shim.c; git commit -qam c1
          expect '[{"package": "pkg", "major_tag": "1"}]' "non-Dockerfile source triggers its image"
          echo x >> pkg/2/README.md; git commit -qam c2
          expect '[]' "Markdown-only change triggers nothing"
          echo x >> nested/pkg/3/sub/conf; echo x >> top/run.sh; git commit -qam c3
          expect '[{"package": "nested/pkg", "major_tag": "3"}]' "nested file maps to its image; top-level dir skipped"
          git mv pkg/1/shim.c nested/pkg/3/shim.c; git commit -qm c4
          expect '[{"package": "nested/pkg", "major_tag": "3"},{"package": "pkg", "major_tag": "1"}]' "move between images rebuilds both"
          git rm -rq pkg/2; git commit -qm c5
          expect '[]' "deleted image is skipped"

  # Every CodeQL-supported language in the repo needs an entry in the CodeQL matrix
  codeql-coverage:
    name: CodeQL Coverage
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check repo
        run: .github/scripts/codeql-coverage.sh . .github/workflows/codeql.yml

      - name: Check fixtures (pass and fail)
        run: |
          set -eu
          check="${GITHUB_WORKSPACE}/.github/scripts/codeql-coverage.sh"
          fx="${RUNNER_TEMP}/fixture"
          git init -q "${fx}"
          mkdir -p "${fx}/.github/workflows" "${fx}/src"
          printf 'jobs:\n  analyze:\n    strategy:\n      matrix:\n        include:\n          - language: actions\n          - language: c-cpp\n' > "${fx}/.github/workflows/codeql.yml"
          touch "${fx}/src/shim.c"
          git -C "${fx}" add -A
          "${check}" "${fx}" "${fx}/.github/workflows/codeql.yml"
          echo "Pass case passed"

          touch "${fx}/src/tool.py"
          git -C "${fx}" add -A
          # Capture output so the expected ::error:: does not annotate this PR
          if out=$("${check}" "${fx}" "${fx}/.github/workflows/codeql.yml" 2>&1); then
            echo "::error::Fail case passed; python has no matrix entry"
            exit 1
          fi
          grep -q "language 'python' has files but no matrix entry" <<< "${out}"
          echo "Fail case failed as expected: python reported missing"

  # Compile the oracle-free/23 UID shim with the Dockerfile's script and base image, then prove every
  # stat entry point it wraps (and coreutils stat, which uses statx) reports 54321-owned files as the caller's
  fakeuid:
    name: fakeuid Shim
    runs-on: ubuntu-26.04
    container: ghcr.io/oracle/oraclelinux:8-slim
    timeout-minutes: 10
    env:
      # World-readable so the arbitrary UID below can load and run them
      OUT: /tmp/fakeuid
    steps:
      - name: Install build tools
        run: microdnf install -y gcc glibc-devel git tar && microdnf clean all

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compile
        run: |
          set -eu
          install -d -m 755 "${OUT}"
          oracle-free/23/build-fakeuid.sh "${OUT}/libfakeuid.so"
          gcc -O2 -Wall -Wextra -Werror .github/scripts/fakeuid-probe.c -o "${OUT}/fakeuid-probe" -ldl

      # Runs as an arbitrary OpenShift-style UID; the probe exits 1 if any call reports the wrong uid
      - name: Smoke test
        env:
          RUN_UID: "1002720000"
        run: |
          set -eu
          f="${OUT}/owned-by-54321"
          touch "${f}"
          chown 54321 "${f}"
          as_run_uid() { setpriv --reuid="${RUN_UID}" --regid=0 --clear-groups "$@"; }
          shim="LD_PRELOAD=${OUT}/libfakeuid.so"

          echo "== Without the shim: every call reports the on-disk owner"
          as_run_uid "${OUT}/fakeuid-probe" "${f}" 54321

          echo "== With the shim, as uid ${RUN_UID}: every call reports the caller"
          as_run_uid env "${shim}" "${OUT}/fakeuid-probe" "${f}" "${RUN_UID}"

          echo "== coreutils stat(1)"
          plain=$(as_run_uid stat -c %u "${f}")
          shimmed=$(as_run_uid env "${shim}" stat -c %u "${f}")
          echo "plain=${plain} shimmed=${shimmed}"
          [ "${plain}" = "54321" ]
          [ "${shimmed}" = "${RUN_UID}" ]

  # Run the PR-built oracle-free/23 image under an arbitrary OpenShift-style UID and wait for a healthy database
  oracle-free-smoke:
    name: oracle-free Smoke
    needs: [builds]
    if: contains(needs.builds.outputs.json, '"oracle-free"')
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    env:
      IMAGE: ghcr.io/${{ github.repository }}/oracle-free:pr-${{ github.event.number }}-23
    steps:
      - name: Shim preloaded
        run: |
          set -eu
          docker pull "${IMAGE}"
          docker run --rm --user 1002720000:0 --entrypoint bash "${IMAGE}" -c '
            set -eu
            grep -qx /usr/local/lib/libfakeuid.so /etc/ld.so.preload
            grep -q libfakeuid.so /proc/self/maps
            echo "euid=$(id -u) libfakeuid.so mapped via /etc/ld.so.preload"
            # coreutils stat(1) uses statx; ORACLE_HOME is owned by 54321 on disk
            uid=$(stat -c %u "${ORACLE_HOME}/bin/oracle")
            echo "stat -c %u ${ORACLE_HOME}/bin/oracle -> ${uid}"
            [ "${uid}" = "$(id -u)" ]
          '

      - name: Database healthy under arbitrary UID
        run: |
          set -eu
          docker run -d --name oracle --user 1002720000:0 -e ORACLE_RANDOM_PASSWORD=yes "${IMAGE}"
          for _ in $(seq 60); do
            status=$(docker inspect -f '{{.State.Health.Status}}' oracle)
            [ "${status}" = "healthy" ] && break
            [ "$(docker inspect -f '{{.State.Running}}' oracle)" = "true" ] || break
            sleep 5
          done
          docker logs oracle 2>&1 | tail -n 40
          echo "health=${status}"
          [ "${status}" = "healthy" ]

  # ==========================================================================
  # WARNING: This job acts as the required merge gate for this workflow.
  # If you add a new job to this workflow, you MUST add its ID to the 'needs'
  # array below, otherwise its failure or cancellation will not block the PR!
  # ==========================================================================
  results:
    name: PR Results
    needs: [build-scripts, builds, codeql-coverage, fakeuid, oracle-free-smoke]
    if: always()
    runs-on: ubuntu-26.04
    timeout-minutes: 1
    steps:
      - uses: bcgov/actions/workflow-results@d209bb08aabe15e5e69aca53b24d338a7b2843d5 # v0.12.0
        with:
          needs: ${{ toJson(needs) }}
