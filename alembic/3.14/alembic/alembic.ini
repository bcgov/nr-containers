# Alembic Configuration File
# Most of the configuration is being set by the env.py file, where various
# configurations will be derived based on env variables.

[alembic]
# path to migration scripts (relative to alembic.ini location)
# configured in the env.py file, this value is required, but essentially ignored,
# as the env.py file will override this value with the actual path to the
#migration scripts, which
# will be the directory scripts/<schema_name>
script_location = .

# again set by env.py, this will be ignored even if set
; version_locations = %(here)s/alembic/versions/THE/TABLES %(here)s/alembic/versions/THE/SEQUENCES

# template used to generate migration file names; use default
# we are not using python based migrations scripts, therefor this variable
# is not relevant
# file_template = %%(rev)s_%%(slug)s

# sys.path path, will be prepended to sys.path if present
prepend_sys_path = .

# timezone to use when rendering the date within the migration file
# timezone =

# max length of characters to apply to the "slug" field if truncating unnamed migrations
sqlalchemy_string_length = 500

# Logging configuration
sqlalchemy_echo = false
sqlalchemy_logging_name = alembic.sqlalchemy



[loggers]
keys = root,sqlalchemy,alembic,alembic.env,alembic.runtime.migration

[handlers]
keys = console

[formatters]
keys = generic,verbose_debug

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers = console
qualname = sqlalchemy.engine

[logger_alembic]
level = WARNING
handlers = console
qualname = alembic
propagate = 0

[logger_alembic.env]
level = WARNING
; level = DEBUG
handlers = console
qualname = alembic.env
propagate = 0

[logger_alembic.runtime.migration]
level = WARNING
handlers = console
qualname = alembic.runtime.migration
propagate = 0


[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
; formatter = verbose_debug
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s - %(lineno)s] %(message)s
datefmt = %H:%M:%S

[formatter_verbose_debug]
format=%(asctime)s - %(lineno)s - %(name)s - %(levelname)s - %(message)s
datefmt=%Y-%m-%d %H:%M:%S
class=logging.Formatter
