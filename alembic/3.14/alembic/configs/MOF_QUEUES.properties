# ==============================================================================
# Schema Management
# ==============================================================================
# defaultSchema: The schema where Flyway writes its metadata history table
flyway.defaultSchema=ALEMBIC

# schemas: List of schemas managed by Flyway where migration scripts execute.
# The first schema in this list will also receive objects created in scripts
# unless explicitly qualified with a schema prefix.
flyway.schemas=MOF_QUEUES

# ==============================================================================
# Custom Schema History Table Configuration
# ==============================================================================
# Sets a non-standard name for the Flyway metadata history table
# (Default is 'flyway_schema_history')
flyway.table=MOF_QUEUES_ALEMBIC_VERSION_SQL
flyway.repeatabletable=MOF_QUEUES_ALEMBIC_REPEATABLE_SQL
